name: CI - PHP Test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env.dev file securely from secrets
        run: |
          cat <<EOF > .env.dev
          ENV_FILE=.env.dev
          APACHE_CONF=${{ secrets.APACHE_CONF }}
          APP_ENV=${{ secrets.APP_ENV }}
          APP_PORT=8080
          DB_PORT=3306
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          DB_CONNECTION=${{ secrets.DB_CONNECTION }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          EOF

      - name: Docker version info
        run: |
          docker --version
          docker compose version

      - name: Build Docker containers
        run: docker compose -f docker-compose.yml --env-file .env.dev build

      - name: Start Docker containers
        run: docker compose -f docker-compose.yml --env-file .env.dev up -d

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL to be ready..."
          retries=0
          until docker compose exec db mysqladmin ping -h db --silent; do
            retries=$((retries+1))
            if [ $retries -ge 30 ]; then
              echo "MySQL did not become ready in time"
              exit 1
            fi
            sleep 2
          done

      - name: Run PHPUnit tests
        run: docker compose exec web ./vendor/bin/phpunit tests/

      - name: Stop Docker containers
        if: always()
        run: docker compose down
