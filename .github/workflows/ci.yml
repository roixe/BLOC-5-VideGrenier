name: CI - PHP Test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env.dev file from secrets
        run: |
          cat <<EOF > .env.dev
          ENV_FILE=.env.dev
          APACHE_CONF=${{ secrets.apache_conf }}
          APP_ENV=${{ secrets.APP_ENV }}
          APP_PORT=8080
          DB_PORT=3306
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          DB_CONNECTION=${{ secrets.DB_CONNECTION }}
          DB_HOST=db
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          EOF

      - name: Build containers
        run: docker-compose -f docker-compose.yml --env-file .env.dev build

      - name: Start containers in background
        run: docker-compose -f docker-compose.yml --env-file .env.dev up -d

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL..."
          until docker exec videgrenier-web-${{ secrets.APP_ENV }} \
            mysql -hdb -u${{ secrets.DB_USERNAME }} -p${{ secrets.DB_PASSWORD }} -e "SELECT 1"; do
            sleep 2
          done

      - name: Run tests
        run: docker-compose exec web ./vendor/bin/phpunit tests/

      - name: Stop containers
        run: docker-compose down
