version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APACHE_CONF: ${APACHE_CONF}
        APP_ENV: prod
    container_name: videgrenier-web-prod
    ports:
      - "${APP_PORT}:80"
    depends_on:
      - db
    env_file:
      - .env.prod

  db:
    image: mysql:8
    container_name: videgrenier-db-prod
    restart: always
    env_file:
      - .env.prod
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data_prod:/var/lib/mysql
      - ./sql/import.sql:/docker-entrypoint-initdb.d/import.sql

volumes:
  db_data_prod:
